# Local file only: this workflow has not been executed (no remote repository).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (pinned)
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Byte-compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -q
      - name: Validate built-in dataset (executes every reference solution)
        run: codeeval --home .ci-state datasets validate core-v1 --execute
      - name: Regression gate demo (oracle baseline vs oracle candidate must pass)
        run: |
          codeeval --home .ci-state run --adapter oracle --baseline main --quiet
          codeeval --home .ci-state run --adapter oracle --quiet
          codeeval --home .ci-state regression --baseline baseline:main --candidate latest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-code-evaluation-lab:ci .
      - name: Docker sandbox backend smoke test
        run: |
          docker pull python:3.11-slim
          python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
          codeeval --home .ci-state --backend docker run --adapter oracle --limit 5 --quiet
