[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-evaluation-lab"
version = "0.1.0"
description = "Evaluate code-generating models: task datasets, sandboxed execution, pass@k, rubrics, experiment tracking, statistical comparison and reports."
readme = "README.md"
license = "MIT"
authors = [{ name = "Robert Ramos" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx2>=2.0"]

[project.scripts]
codeeval = "codeeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeeval = ["datasets/builtin/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: spawns many sandbox processes (still part of the default run)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT"]
ignore = ["RUF012", "E501", "PT011"]  # line length is enforced by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
